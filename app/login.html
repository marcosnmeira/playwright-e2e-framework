<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Demo App</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="/index.html">playwright-e2e-framework</a>
        <div class="nav-links">
          <a href="/register.html">Cadastro</a>
          <a href="/products.html">Produtos</a>
          <a href="/cart.html">Carrinho (<span data-testid="cart-badge">0</span>)</a>
          <span data-testid="current-user">Visitante</span>
          <button type="button" class="secondary" data-testid="logout-button" hidden>Sair</button>
        </div>
      </nav>
    </header>

    <main>
      <section class="panel" style="max-width: 520px; margin: 0 auto">
        <div class="section-title">
          <h1>Login E2E</h1>
          <span class="badge">@smoke</span>
        </div>
        <div class="alert success" role="alert" data-testid="login-feedback" hidden></div>
        <form data-testid="login-form">
          <div class="form-field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="qa@example.com" required />
          </div>
          <div class="form-field">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" placeholder="********" required />
          </div>
          <button type="submit">Entrar</button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
